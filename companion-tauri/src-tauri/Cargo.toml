[package]
name = "vdgs-companion"
version = "0.1.0"
edition = "2021"

[lib]
name = "companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
pelite = "0.10"
sysinfo = "0.32"
dirs = "5"
percent-encoding = "2"
thiserror = "1"

# Cargo's release default `strip = "debuginfo"` also strips the proc-macro dylibs it builds
# for the host, and the dyld in macOS 27 refuses to load those ("mis-aligned LINKEDIT
# string pool") - so `cargo tauri build` dies inside serde_derive / tokio_macros before
# any of our code compiles. Keep host-side build artifacts unstripped; the shipped
# binary is unchanged.
[profile.release.build-override]
strip = false
